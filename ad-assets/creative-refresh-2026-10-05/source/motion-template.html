<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Manrope;src:url(Manrope.ttf)}body{margin:0;background:#080809}canvas{display:block}</style></head><body><canvas id="ad"></canvas><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),logo=new Image();logo.src='nucaloric-wordmark.svg';
window.ready=Promise.all([document.fonts.load('600 100px Manrope'),new Promise(r=>logo.onload=r)]);
window.drawAd=(t,w=1920,h=1080,concept='make')=>{
 c.width=w;c.height=h;ctx.fillStyle='#080809';ctx.fillRect(0,0,w,h);const vertical=h>w,scale=w/1080,pad=w*.075;
 const ink='#080809',white='#f4f1ec',pink='#e7b5c4';
 const gap=vertical?26:30;
 for(let y=h*.42;y<h-pad;y+=gap)for(let x=pad;x<w-pad;x+=gap){const nx=x/w,ny=y/h,crest=.71+.065*Math.sin(nx*7-t*.55)+.02*Math.sin(nx*17+t*.3);const strength=Math.max(0,(ny-crest+.15)/.35);const band=Math.exp(-Math.pow((ny-crest)/.1,2));const s=Math.min(1,strength*.6+band*.5);ctx.globalAlpha=.10+s*.78;ctx.fillStyle=((Math.floor(x/gap)*17+Math.floor(y/gap)*31)%53)<5?pink:white;ctx.beginPath();ctx.arc(x,y,.7+s*(vertical?4.5:5),0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1;ctx.fillStyle=pink;ctx.font=`500 ${Math.round(w*.013)}px Manrope`;ctx.fillText('NUCALORIC / A PLACE FOR WHAT COMES NEXT',pad,pad+20*scale);
 const lines=concept==='mind'?['A MIND.','A PURPOSE.','A PROJECT.']:concept==='together'?['START SMALL.','BUILD','TOGETHER.']:['MAKE','SOMETHING','REAL.'];
 const fontSize=vertical?w*.125:w*.09,lineHeight=fontSize*1.08,top=vertical?h*.24:h*.24;
 lines.forEach((line,i)=>{const progress=Math.max(0,Math.min(1,(t-i*.2)/.45)),ease=1-Math.pow(1-progress,3);ctx.save();ctx.beginPath();ctx.rect(pad,top+i*lineHeight-fontSize*1.03,w-pad*2,lineHeight);ctx.clip();ctx.globalAlpha=progress;ctx.fillStyle=i===2?pink:white;ctx.font=`600 ${fontSize}px Manrope`;ctx.fillText(line,pad,top+i*lineHeight+(1-ease)*lineHeight);ctx.restore()});
 ctx.fillStyle=white;ctx.globalAlpha=Math.min(1,Math.max(0,(t-.9)/.5));ctx.font=`400 ${Math.round(w*.018)}px Manrope`;const copy=concept==='mind'?'Give your ideas something useful to do.':concept==='together'?'Your work. Your people. Your next chapter.':'Utilize Solana, for real.';ctx.fillText(copy,pad,top+lineHeight*3+.055*h);
 const lw=vertical?w*.51:w*.30,lh=lw/(5440/900);ctx.fillStyle=ink;ctx.fillRect(0,h-pad-lh-25*scale,w,pad+lh+25*scale);ctx.drawImage(logo,pad,h-pad-lh,lw,lh);ctx.fillStyle=white;ctx.font=`500 ${Math.round(w*.013)}px Manrope`;ctx.fillText('IDEA → TOOLSET → PROJECT',w-pad-w*.31,h-pad);ctx.globalAlpha=1;
 return c.toDataURL('image/jpeg', .98).split(',')[1];
};
</script></body></html>
